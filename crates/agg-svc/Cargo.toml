[package]
name = "agg-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AGG Windows service. Owns Wintun; UI talks over a named pipe."
license = "MIT"
publish = false

[[bin]]
name = "agg-svc"
path = "src/main.rs"

[dependencies]
agg-core.workspace = true
agg-platform-windows.workspace = true
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
